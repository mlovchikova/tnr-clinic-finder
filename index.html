<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TNR Clinic Directory & Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-emerald-800 text-white py-8 px-4 shadow-md">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl font-bold tracking-tight">Community Cat TNR Finder</h1>
      <p class="mt-2 text-emerald-100 text-sm md:text-base">
        Locate low-cost Trap-Neuter-Return (TNR) clinics and spay/neuter resources within 50 miles of your ZIP code.
      </p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
<!-- Search Controls -->
      <form id="search-form" class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
        <!-- ZIP Code Field -->
        <div>
          <label for="zip-input" class="block text-sm font-semibold text-slate-700 mb-1.5">
            ZIP Code
          </label>
          <input
            type="text"
            id="zip-input"
            placeholder="e.g. 95620"
            value="95620"
            maxlength="5"
            class="h-12 w-full box-border px-4 text-sm font-mono border border-slate-300 rounded-lg bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 shadow-sm leading-none"
            required
          />
        </div>

        <!-- Radius Dropdown Field -->
        <div>
          <label for="radius-select" class="block text-sm font-semibold text-slate-700 mb-1.5">
            Search Radius
          </label>
          <div class="relative w-full">
            <select
              id="radius-select"
              class="h-12 w-full appearance-none box-border pl-4 pr-10 text-sm border border-slate-300 rounded-lg bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 shadow-sm cursor-pointer leading-none"
            >
              <option value="15">Within 15 miles</option>
              <option value="30">Within 30 miles</option>
              <option value="50" selected>Within 50 miles</option>
            </select>
            <!-- Dropdown Chevron -->
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Submit Button (Aligned to baseline by items-end) -->
        <div>
          <button
            type="submit"
            class="h-12 w-full box-border border border-transparent px-4 bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white font-medium text-sm rounded-lg shadow-sm transition flex items-center justify-center cursor-pointer leading-none"
          >
            Find Clinics
          </button>
        </div>
      </form>      <div id="status-message" class="text-xs text-slate-500 mt-2"></div>
    </section>

    <!-- Clinic Results -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-slate-800" id="results-count">Showing Clinics</h2>
        <span class="text-xs bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-medium">Sorted by Distance</span>
      </div>

      <div id="clinic-list" class="space-y-4">
        <!-- Clinic cards injected via JavaScript -->
      </div>
    </section>
  </main>

  <script>
    let clinicsData = [];

    // Local centroid fallback for 95620
    const DEFAULT_COORDS = { "95620": { lat: 38.4455, lng: -121.8233 } };

    // Haversine formula to calculate miles between two coordinates
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 3958.8; // Earth's radius in miles
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Geocoding via Zippopotam
    async function getCoordinatesForZip(zip) {
      if (DEFAULT_COORDS[zip]) {
        return DEFAULT_COORDS[zip];
      }
      try {
        const response = await fetch(`https://api.zippopotam.us/us/${zip}`);
        if (!response.ok) throw new Error("ZIP not found");
        const data = await response.json();
        return {
          lat: parseFloat(data.places[0].latitude),
          lng: parseFloat(data.places[0].longitude),
          place: `${data.places[0]["place name"]}, ${data.places[0]["state abbreviation"]}`
        };
      } catch (err) {
        return null;
      }
    }

    // Fetch the external JSON file
    async function loadClinics() {
      try {
        const response = await fetch("./clinics.json");
        if (!response.ok) throw new Error("Failed to load clinics.json");
        clinicsData = await response.json();
      } catch (err) {
        console.error("Directory load error:", err);
        document.getElementById("status-message").textContent =
          "Could not load clinic directory. Please ensure clinics.json exists.";
      }
    }

    function formatAvailabilityDate(dateStr) {
      if (!dateStr) return "";
      const [year, month, day] = dateStr.split("-");
      const date = new Date(year, month - 1, day);
      return date.toLocaleDateString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric"
      });
    }
    function formatRelativeTime(isoString) {
      if (!isoString) return "";
      const date = new Date(isoString);
      const now = new Date();
      const diffHours = Math.floor((now - date) / (1000 * 60 * 60));

      if (diffHours < 1) return "Just now";
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays === 1) return "Yesterday";
      if (diffDays < 14) return `${diffDays}d ago`;
      return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }
    function renderAvailabilityBadge(availability, releaseWindow) {
      if (!availability) return "";

      if (availability.status === "available" && availability.earliestDate) {
        const formatted = formatAvailabilityDate(availability.earliestDate);
        return `
          <div class="mt-3 flex items-center justify-between flex-wrap gap-2 text-xs bg-emerald-50 text-emerald-950 border border-emerald-300 px-3 py-2 rounded-lg">
            <div class="flex items-center gap-2">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span><strong>Next Open Date:</strong> ${formatted} ${availability.slotType ? `(${availability.slotType})` : ""}</span>
            </div>
            ${releaseWindow ? `<span class="text-[11px] text-emerald-700 italic">Schedule: ${releaseWindow}</span>` : ""}
          </div>
        `;
      }

      if (availability.status === "batch_drop_scheduled" && availability.earliestDate) {
        const formatted = formatAvailabilityDate(availability.earliestDate);
        return `
          <div class="mt-3 flex items-center justify-between flex-wrap gap-2 text-xs bg-sky-50 text-sky-950 border border-sky-300 px-3 py-2 rounded-lg">
            <div class="flex items-center gap-2">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-sky-500"></span>
              <span><strong>Upcoming Batch Drop:</strong> Opens ${formatted}</span>
            </div>
            ${releaseWindow ? `<span class="text-[11px] text-sky-700 font-medium">Window: ${releaseWindow}</span>` : ""}
          </div>
        `;
      }

      if (availability.status === "booked_out") {
        return `
          <div class="mt-3 flex items-center justify-between flex-wrap gap-2 text-xs bg-amber-50 text-amber-950 border border-amber-300 px-3 py-2 rounded-lg">
            <div class="flex items-center gap-2">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500"></span>
              <span><strong>Online Calendar Full:</strong> Check back during next batch drop.</span>
            </div>
            ${releaseWindow ? `<span class="text-[11px] text-amber-800">Drop Rule: ${releaseWindow}</span>` : ""}
          </div>
        `;
      }

      if (releaseWindow) {
        return `
          <div class="mt-3 text-xs bg-slate-50 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg">
            <strong>Drop Window / Intake:</strong> ${releaseWindow}
          </div>
        `;
      }

      return "";
    }

    function renderClinics(originLat, originLng, radiusLimit) {
      const listElement = document.getElementById("clinic-list");
      const countElement = document.getElementById("results-count");

      const enrichedClinics = clinicsData
        .map((clinic) => {
          const distance = calculateDistance(originLat, originLng, clinic.lat, clinic.lng);
          return { ...clinic, distance };
        })
        .filter((clinic) => clinic.distance <= radiusLimit)
        .sort((a, b) => a.distance - b.distance);

      countElement.textContent = `${enrichedClinics.length} Clinic${enrichedClinics.length === 1 ? "" : "s"} Found`;

      if (enrichedClinics.length === 0) {
        listElement.innerHTML = `
          <div class="bg-white p-6 rounded-lg text-center border border-slate-200 text-slate-500">
            No TNR clinics registered within ${radiusLimit} miles of this location yet.
          </div>`;
        return;
      }

      listElement.innerHTML = enrichedClinics
        .map((clinic) => {
          const hasOnlineBooking = clinic.bookingUrl && clinic.bookingType === "online_system";
          const freeProgram = clinic.countyFreeProgram;
          const fb = clinic.facebook;

          return `
          <article class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm hover:border-emerald-300 transition flex flex-col justify-between">
            <div>
              <!-- Header & Distance -->
              <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2">
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <h3 class="text-lg font-bold text-slate-900">${clinic.name}</h3>
                    <span class="text-[11px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium border border-slate-200">
                      ${clinic.county} County
                    </span>
                    ${
                      freeProgram && freeProgram.hasFreeProgram
                        ? '<span class="text-[11px] bg-teal-100 text-teal-900 px-2 py-0.5 rounded font-semibold border border-teal-300">🎉 Free for County Residents</span>'
                        : ""
                    }
                    ${
                      hasOnlineBooking
                        ? '<span class="text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-medium border border-emerald-300">⚡ Online Booking</span>'
                        : ""
                    }
                  </div>
                  <p class="text-sm text-slate-600 mt-1">${clinic.address}</p>
                </div>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 self-start shrink-0">
                  ${clinic.distance.toFixed(1)} mi away
                </span>
              </div>

              <!-- General Notes -->
              <p class="text-xs text-slate-600 mt-3 bg-slate-50 p-2.5 rounded border border-slate-100 leading-relaxed">
                ${clinic.notes}
              </p>

              <!-- County Free Services Box -->
              ${
                freeProgram
                  ? `
                  <div class="mt-2 text-xs p-2.5 rounded-lg border ${
                    freeProgram.hasFreeProgram
                      ? "bg-teal-50/70 border-teal-200 text-teal-950"
                      : "bg-slate-50 border-slate-200 text-slate-700"
                  }">
                    <span class="font-bold">${freeProgram.hasFreeProgram ? "Resident Subsidy:" : "Resident Rate:"}</span>
                    <span class="font-medium">${freeProgram.programName}</span> —${freeProgram.details}
                  </div>`
                  : ""
              }

              <!-- Availability / Batch Drop Schedule Banner -->
              ${renderAvailabilityBadge(clinic.availability, clinic.releaseWindow)}

              <!-- Facebook Latest Post Callout -->
              ${
                fb && fb.latestPost
                  ? `
                  <div class="mt-3 bg-blue-50/60 border border-blue-200 rounded-lg p-3 text-xs text-slate-800">
                    <div class="flex items-center justify-between mb-1">
                      <span class="font-semibold text-blue-900 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 fill-blue-600" viewBox="0 0 24 24">
                          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Latest Update:
                      </span>
                      <span class="text-[11px] text-slate-500 font-medium">${formatRelativeTime(fb.latestPost.postedAt)}</span>
                    </div>
                    <p class="text-slate-700 leading-relaxed italic">"${fb.latestPost.text}"</p>
                    <div class="mt-1.5">
                      <a href="${fb.latestPost.postUrl || fb.pageUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-700 hover:text-blue-900 font-medium underline text-[11px]">
                        View on Facebook ↗
                      </a>
                    </div>
                  </div>`
                  : ""
              }

              <!-- TNR Requirements Badges -->
              <div class="flex flex-wrap gap-2 mt-3">
                ${
                  clinic.requiresTrap
                    ? '<span class="text-[11px] bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded font-medium">Humane Trap Required</span>'
                    : ""
                }
                ${
                  clinic.earTipRequired
                    ? '<span class="text-[11px] bg-blue-50 text-blue-800 border border-blue-200 px-2 py-0.5 rounded font-medium">Ear-Tip Mandatory</span>'
                    : ""
                }
              </div>
            </div>

            <!-- Footer Actions -->
            <div class="mt-5 pt-3 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-3 text-sm">
                <a href="tel:${clinic.phone}" class="text-emerald-700 hover:text-emerald-800 font-medium">
                  📞 ${clinic.phone}
                </a>
                <span class="text-slate-300">|</span>
                <a href="${clinic.website}" target="_blank" rel="noopener noreferrer" class="text-slate-600 hover:text-slate-900 font-medium">
                  Website ↗
                </a>
                ${
                  fb && fb.pageUrl
                    ? `
                    <span class="text-slate-300">|</span>
                    <a href="${fb.pageUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-700 hover:text-blue-900 font-medium flex items-center gap-1">
                      Facebook ↗
                    </a>`
                    : ""
                }
              </div>

              ${
                hasOnlineBooking
                  ? `<a href="${clinic.bookingUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-sm transition">
                      Book Online ↗
                    </a>`
                  : `<span class="text-xs text-slate-400 italic">Phone / Walk-in Only</span>`
              }
            </div>
          </article>
        `;
        })
        .join("");
      }
    async function handleSearch(e) {
      if (e) e.preventDefault();
      const zip = document.getElementById("zip-input").value.trim();
      const radius = parseFloat(document.getElementById("radius-select").value);
      const status = document.getElementById("status-message");

      status.textContent = "Locating postal zone...";
      const coords = await getCoordinatesForZip(zip);

      if (!coords) {
        status.textContent = "Could not locate this ZIP code. Please verify the 5 digits.";
        return;
      }

      status.textContent = coords.place ? `Showing results around ${coords.place}` : "";
      renderClinics(coords.lat, coords.lng, radius);
    }

    document.getElementById("search-form").addEventListener("submit", handleSearch);

    // Initial load: Fetch JSON first, then render initial results
    async function initialize() {
      await loadClinics();
      handleSearch();
    }

    initialize();
  </script>
</body>
</html>
