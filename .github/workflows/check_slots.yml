name: Check Clinic Availability & Update Directory

on:
  schedule:
    # Runs daily at 06:00 UTC (11:00 PM PDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Availability Scraper
        run: |
          python scripts/check_slots.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clinics.json
          if git diff --staged --quiet; then
            echo "No changes in availability detected."
          else
            git commit -m "chore(data): auto-update clinic availability [skip ci]"
            git push
          fi